<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Math Madness — математический раннер</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div id="startMenu" class="menu-overlay">
        <div class="settings-corner">
            <button id="settingsToggleBtn" class="settings-toggle-btn">⚙️</button>
        </div>
        <div class="menu-card">
            <h1>🤖MATH MADNESS</h1>
            <button id="playButton" class="start-btn">▶ НАЧАТЬ</button>
            <div id="settingsPanel" class="settings-panel" style="display: none;">
                <div class="menu-settings">
                    <div class="menu-setting-row">
                        <span>Цвет фона:</span>
                        <select id="menuBgSelect">
                            <option value="#1a2a3a">Тёмное пространство</option>
                            <option value="#1f3b3a">Строгая классика</option>
                            <option value="#442e3a">Необычная интерпретация</option>
                        </select>
                    </div>
                    <div class="menu-setting-row">
                        <span>Скин персонажа:</span>
                        <select id="menuSkinSelect">
                            <option value="dark">🌑 Тёмная версия</option>
                            <option value="light">🌕 Светлая версия</option>
                        </select>
                    </div>
                    <div class="menu-setting-row">
                        <span>Цветовая тема:</span>
                        <button class="theme-btn" onclick="toggleTheme()">Смена темы (светлая/темная)</button>
                    </div>
                    <div class="menu-setting-row">
                        <span>⚡️🌩️Скорость персонажа:</span>
                        <div class="difficulty-group">
                            <button data-diff-menu="easy" class="difficulty-btn diff-menu-btn">Медленная</button>
                            <button data-diff-menu="medium" class="difficulty-btn diff-menu-btn active">Средняя</button>
                            <button data-diff-menu="hard" class="difficulty-btn diff-menu-btn">Быстрая</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="game-container">
        <canvas id="gameCanvas" width="1050" height="650"></canvas>
        <div class="info-panel">
            <div class="score-box">📈СЧЁТ📉: <span id="scoreValue">0</span></div>
            <div class="record">🪎РЕКОРД🪎: <span id="recordValue">0</span></div>
        </div>
    </div>
    <div id="gameOverModal" class="modal">
        <div class="modal-card">
            <h3>ПРОИГРЫШ</h3>
            <div id="modalMessage"></div>
            <div id="questionZone" style="display: none;">
                <div class="question-text" id="algebraQuestion"></div>
                <input type="number" id="answerInput" placeholder="Введите число">
                <button id="submitAnswerBtn">✅ОТВЕТИТЬ❔</button>
            </div>
            <div class="modal-buttons">
                <button id="restartFromStartBtn" class="restart-btn">НАЧАТЬ ИГРУ СНАЧАЛА</button>
                <button id="solveToContinueBtn" class="solve-btn">РЕШИТЬ ЗАДАЧУ</button>
                <button id="mainMenuBtn" class="menu-btn">ГЛАВНОЕ МЕНЮ</button>
            </div>
            <div class="message-small">🐷 Реши уравнение — продолжишь с момента проигрыша!</div>
        </div>
    </div>
</body>
</html>
